[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-graph-construction"
version = "1.0.0"
description = "Construct cleaned SAGE line graphs and MATLAB feature matrices from educational text."
requires-python = ">=3.10"
dependencies = [
  "hydra-core>=1.3,<2",
  "kg-gen>=0.4.0",
  "networkx>=3",
  "numpy>=1.24",
  "scipy>=1.10",
  "sentence-transformers>=5.1",
]

[project.optional-dependencies]
person-filtering = ["spacy>=3.7"]

[tool.setuptools]
py-modules = ["main", "clean", "embed"]
