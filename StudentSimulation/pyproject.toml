[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-student-simulation"
version = "1.0.0"
description = "Simulate student responses and assess Beta-Bernoulli beliefs on SAGE line graphs."
requires-python = ">=3.10"
dependencies = [
  "hydra-core>=1.3,<2",
  "networkx>=3",
  "numpy>=1.24",
  "openai>=1.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
]

[tool.setuptools]
py-modules = ["main", "initialization", "student"]
packages = ["source", "source.propagation", "source.questionselection", "source.scoring"]
